<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithm Visualizer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1>Algorithm Visualizer</h1>
  </div>
  <div class="topbar-right">
    <span class="algo-count" id="algo-count"></span>
    <button class="icon-btn" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main class="layout">

  <!-- ───────────────── left: algorithm picker ───────────────── -->
  <nav class="sidebar" id="sidebar" aria-label="Algorithms">
    <input type="search" id="algo-filter" class="filter" placeholder="Search algorithms…" autocomplete="off">
    <div id="algo-list" class="algo-list"></div>
  </nav>

  <!-- ───────────────── middle: the visual ───────────────── -->
  <section class="stage-wrap">
    <div class="stage-head">
      <div>
        <h2 id="algo-title">—</h2>
        <p id="algo-note" class="note">Pick an algorithm to begin.</p>
      </div>
      <div class="stage-head-right">
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="race-pane" id="pane-a">
        <div class="race-head" id="head-a"></div>
        <canvas id="canvas"></canvas>
        <div class="race-foot" id="foot-a"></div>
      </div>
      <div class="race-pane" id="pane-b" hidden>
        <div class="race-head" id="head-b"></div>
        <canvas id="canvas-b"></canvas>
        <div class="race-foot" id="foot-b"></div>
      </div>
    </div>

    <!-- playback -->
    <div class="controls">
      <div class="controls-main">
        <button class="ctrl" id="btn-reset"  title="Reset to the first step">⏮</button>
        <button class="ctrl" id="btn-back"   title="One step back">◀</button>
        <button class="ctrl play" id="btn-play" title="Play / pause">▶</button>
        <button class="ctrl" id="btn-fwd"    title="One step forward">▶</button>
        <button class="ctrl" id="btn-end"    title="Jump to the final step">⏭</button>
      </div>

      <div class="scrub-wrap">
        <input type="range" id="scrub" class="scrub" min="0" max="0" value="0">
        <div class="scrub-label"><span id="step-label">step 0 / 0</span></div>
      </div>

      <label class="speed">
        speed
        <input type="range" id="speed" min="1" max="100" value="55">
      </label>

      <label class="speed race-picker" id="race-wrap">
        race
        <select id="race-select"><option value="">off</option></select>
      </label>
    </div>

    <!-- per-algorithm inputs (array size, grid tools, etc.) -->
    <div class="inputs" id="inputs"></div>
  </section>

  <!-- ───────────────── right: explanation ───────────────── -->
  <aside class="info" aria-label="Explanation">
    <div class="info-block">
      <h3>What it does</h3>
      <p id="info-about">—</p>
    </div>

    <div class="info-block">
      <h3>Cost</h3>
      <table class="cost">
        <tr><td>Best</td><td id="cost-best">—</td></tr>
        <tr><td>Average</td><td id="cost-avg">—</td></tr>
        <tr><td>Worst</td><td id="cost-worst">—</td></tr>
        <tr><td>Memory</td><td id="cost-space">—</td></tr>
        <tr><td>Stable</td><td id="cost-stable">—</td></tr>
      </table>
    </div>

    <div class="info-block">
      <h3>Live counters</h3>
      <div class="stats" id="stats"></div>
    </div>

    <div class="info-block">
      <h3>Steps</h3>
      <ol class="pseudo" id="pseudocode"></ol>
    </div>
  </aside>

</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
